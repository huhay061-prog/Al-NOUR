<style>
:root{--bg:#090a09;--sf:#131613;--sf2:#1a211b;--tx:#ece6d6;--mu:#9a9585;--gd:#c9a24b;--gr:#1f5a43;--ln:#2a302a;--fs:30px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme="light"]{--bg:#eef0e9;--sf:#fbfcf8;--sf2:#e2e8dc;--tx:#14231c;--mu:#5d6a60;--gd:#8a6a1c;--gr:#1f5a43;--ln:#cdd5c8;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;font-size:16px;line-height:1.7;background-image:radial-gradient(circle at 50% -10%,rgba(31,90,67,.35),transparent 55%)}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.hero{text-align:center;padding:18px 0 8px}
.hero svg{width:64px;height:64px}
.hero h1{font:700 64px/1.1 Amiri,serif;color:var(--gd);margin:0}
.hero small{letter-spacing:.35em;color:var(--mu);font-size:12px}
h2{font:700 22px Amiri,serif;margin:22px 0 8px;color:var(--gd)}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.top h2{margin:0;flex:1}
.ib{width:42px;height:42px;border:1px solid var(--ln);border-radius:50%;background:var(--sf);font-size:18px}
.date{display:block;width:100%;text-align:right;background:var(--sf);border-inline-start:3px solid var(--gd);padding:12px 14px;border-radius:4px;margin:10px 0}
.date b{font:700 22px Amiri,serif}.date span{color:var(--mu);font-size:14px;display:block}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.grid button{background:var(--sf);border:1px solid var(--ln);border-radius:14px 14px 4px 14px;padding:12px 2px;font-size:13px}
.grid i{display:block;font-style:normal;font-size:24px;color:var(--gd)}
.ayah{background:linear-gradient(135deg,var(--gr),#0d2a20);color:#f3ecd7;border-radius:6px;padding:16px;margin:10px 0}
.ayah p{font:400 24px/2.1 Amiri,serif;margin:0;text-align:center}.ayah small{opacity:.8}
.cont{display:block;width:100%;text-align:right;background:var(--sf);border:1px dashed var(--gd);border-radius:6px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:right;padding:13px 4px;border-bottom:1px solid var(--ln)}
.row i{font-style:normal;font-size:12px;color:var(--mu);border:1px solid var(--ln);border-radius:20px;padding:0 10px}
.row i.ok{color:var(--gd);border-color:var(--gd)}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:6px 0}
textarea{min-height:140px}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1;border:1px solid var(--ln);border-radius:20px;padding:6px}
.seg .on,.btn{background:var(--gd);color:#14110a;border-color:var(--gd);font-weight:700}
.btn{border-radius:8px;padding:10px 16px;margin:4px 0}
.btn.alt{background:var(--sf);color:var(--tx);border:1px solid var(--ln);font-weight:400}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tools button{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:4px 14px}
.txt{font:400 var(--fs)/2.3 Amiri,serif;text-align:justify;margin:14px 0}
.txt p{margin:0 0 .5em}.no{color:var(--gd);font-size:.6em}
.bsm{font:400 calc(var(--fs) + 2px) Amiri,serif;text-align:center;color:var(--gd);margin:14px 0}
.empty{background:var(--sf);border-radius:6px;padding:14px;color:var(--mu)}
.src{color:var(--mu);font-size:14px}
.tas{display:block;margin:18px auto;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,var(--sf2),var(--sf));border:2px solid var(--gd);font:700 72px Amiri,serif;color:var(--gd);user-select:none;touch-action:manipulation}
.tas small{display:block;font:500 14px Tajawal,sans-serif;color:var(--mu)}
.ev{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--sf);border-top:1px solid var(--gd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;font-size:12px;color:var(--mu)}nav i{display:block;font-style:normal;font-size:20px}
nav .on{color:var(--gd)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--gd);color:#14110a;padding:6px 18px;border-radius:20px;display:none;z-index:9}
.note{font-size:13px;color:var(--mu)}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const R=(k,d)=>{try{const v=localStorage.getItem('noor_'+k);return v?JSON.parse(v):d}catch(e){return d}};
const Wr=(k,v)=>{try{localStorage.setItem('noor_'+k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const norm=s=>String(s).replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const SN="الفاتحة,البقرة,آل عمران,النساء,المائدة,الأنعام,الأعراف,الأنفال,التوبة,يونس,هود,يوسف,الرعد,إبراهيم,الحجر,النحل,الإسراء,الكهف,مريم,طه,الأنبياء,الحج,المؤمنون,النور,الفرقان,الشعراء,النمل,القصص,العنكبوت,الروم,لقمان,السجدة,الأحزاب,سبأ,فاطر,يس,الصافات,ص,الزمر,غافر,فصلت,الشورى,الزخرف,الدخان,الجاثية,الأحقاف,محمد,الفتح,الحجرات,ق,الذاريات,الطور,النجم,القمر,الرحمن,الواقعة,الحديد,المجادلة,الحشر,الممتحنة,الصف,الجمعة,المنافقون,التغابن,الطلاق,التحريم,الملك,القلم,الحاقة,المعارج,نوح,الجن,المزمل,المدثر,القيامة,الإنسان,المرسلات,النبأ,النازعات,عبس,التكوير,الانفطار,المطففين,الانشقاق,البروج,الطارق,الأعلى,الغاشية,الفجر,البلد,الشمس,الليل,الضحى,الشرح,التين,العلق,القدر,البينة,الزلزلة,العاديات,القارعة,التكاثر,العصر,الهمزة,الفيل,قريش,الماعون,الكوثر,الكافرون,النصر,المسد,الإخلاص,الفلق,الناس".split(',');
const QT={
1:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ\nٱلرَّحْمَٰنِ ٱلرَّحِيمِ\nمَٰلِكِ يَوْمِ ٱلدِّينِ\nإِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ\nٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ\nصِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ",
108:"إِنَّآ أَعْطَيْنَٰكَ ٱلْكَوْثَرَ\nفَصَلِّ لِرَبِّكَ وَٱنْحَرْ\nإِنَّ شَانِئَكَ هُوَ ٱلْأَبْتَرُ",
112:"قُلْ هُوَ ٱللَّهُ أَحَدٌ\nٱللَّهُ ٱلصَّمَدُ\nلَمْ يَلِدْ وَلَمْ يُولَدْ\nوَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ",
113:"قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ\nمِن شَرِّ مَا خَلَقَ\nوَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ\nوَمِن شَرِّ ٱلنَّفَّٰثَٰتِ فِى ٱلْعُقَدِ\nوَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",
114:"قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ\nمَلِكِ ٱلنَّاسِ\nإِلَٰهِ ٱلنَّاسِ\nمِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ\nٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ\nمِنَ ٱلْجِنَّةِ وَٱلنَّاسِ"};
const BASE=[];
SN.forEach((n,i)=>BASE.push({id:'q'+(i+1),cat:'q',title:'سورة '+n,text:QT[i+1]||'',source:QT[i+1]?'القرآن الكريم':''}));
const L=(c,s)=>s.split('|').forEach((t,i)=>BASE.push({id:c+(i+1),cat:c,title:t,text:'',source:''}));
L('d','دعاء كميل بن زياد|دعاء أبي حمزة الثمالي|دعاء الافتتاح|دعاء التوسل|دعاء الندبة|دعاء المجير|دعاء الجوشن الكبير|دعاء العهد|دعاء مكارم الأخلاق|المناجاة الخمس عشرة|أدعية الصحيفة السجادية|أدعية أيام الأسبوع|أدعية شهر رمضان|أدعية شهري رجب وشعبان|أدعية شهري محرم وصفر');
L('z','زيارة عاشوراء|زيارة وارث|زيارة أمين الله|الزيارة الجامعة الكبيرة|الزيارة الجامعة الصغيرة|زيارة الإمام الحسين (ع)|زيارة الإمام علي (ع)|زيارة الإمام الحسن (ع)|زيارة الإمام زين العابدين (ع)|زيارة الإمام الباقر (ع)|زيارة الإمام الصادق (ع)|زيارة الإمام الكاظم (ع)|زيارة الإمام الرضا (ع)|زيارة الإمام الجواد (ع)|زيارة الإمام الهادي (ع)|زيارة الإمام العسكري (ع)|زيارة الإمام المهدي (عج)|زيارة السيدة فاطمة الزهراء (ع)|زيارة السيدة زينب (ع)|زيارة أبي الفضل العباس (ع)');

const FX2={"d1": {"text": "اَللّهُمَّ إنِّي أَسْأَلُكَ بِرَحْمَتِكَ الَّتي وَسِعَتْ كُلَّ شَيْء، وَبِقُوَّتِكَ الَّتي قَهَرْتَ بِها كُلَّ شَيْء، وَخَضَعَ لَها كُلُّ شَيء، وَذَلَّ لَها كُلُّ شَيء، وَبِجَبَرُوتِكَ الَّتي غَلَبْتَ بِها كُلَّ شَيء، وَبِعِزَّتِكَ الَّتي لا يَقُومُ لَها شَيءٌ، وَبِعَظَمَتِكَ الَّتي مَلأَتْ كُلَّ شَيء، وَبِسُلْطانِكَ الَّذي عَلا كُلَّ شَيء، وَبِوَجْهِكَ الْباقي بَعْدَ فَناءِ كُلِّ شَيء، وَبِأَسْمائِكَ الَّتي مَلأَتْ أرْكانَ كُلِّ شَيء، وَبِعِلْمِكَ الَّذي أَحاطَ بِكُلِّ شَيء، وَبِنُورِ وَجْهِكَ الَّذي أَضاءَ لَهُ كُلُّ شيء، يا نُورُ يا قُدُّوسُ، يا أَوَّلَ الأوَّلِينَ وَيا آخِرَ الآخِرينَ.\nاَللّهُمَّ اغْفِرْ لِي الذُّنُوبَ الَّتي تَهْتِكُ الْعِصَمَ، اَللّهُمَّ اغْفِرْ لِي الذُّنُوبَ الَّتي تُنْزِلُ النِّقَمَ، اَللّهُمَّ اغْفِرْ لِي الذُّنُوبَ الَّتي تُغَيِّرُ النِّعَمَ، اَللّهُمَّ اغْفِرْ لي الذُّنُوبَ الَّتي تَحْبِسُ الدُّعاءَ، اَللّهُمَّ اغْفِرْ لِي الذُّنُوبَ الَّتي تُنْزِلُ الْبَلاءَ، اَللّهُمَّ اغْفِرْ لي كُلَّ ذَنْب اَذْنَبْتُهُ، وَكُلَّ خَطيئَة اَخْطَأتُها.\nاَللّهُمَّ اِنّي اَتَقَرَّبُ اِلَيْكَ بِذِكْرِكَ، وَاَسْتَشْفِعُ بِكَ إلى نَفْسِكَ، وَأَسْأَلُكَ بِجُودِكَ أن تُدْنِيَني مِنْ قُرْبِكَ، وَأَنْ تُوزِعَني شُكْرَكَ، وَأَنْ تُلْهِمَني ذِكْرَكَ، اَللّهُمَّ إني أَسْأَلُكَ سُؤالَ خاضِع مُتَذَلِّل خاشِع أن تُسامِحَني وَتَرْحَمَني وَتَجْعَلَني بِقِسْمِكَ راضِياً قانِعاً، وَفي جَميعِ الأحوال مُتَواضِعاً.\nاَللّهُمَّ وَأَسْأَلُكَ سُؤالَ مَنِ اشْتَدَّتْ فاقَتُهُ، وَاَنْزَلَ بِكَ عِنْدَ الشَّدائِدِ حاجَتَهُ، وَعَظُمَ فيما عِنْدَكَ رَغْبَتُهُ.\nاَللّهُمَّ عَظُمَ سُلْطانُكَ، وَعَلا مَكانُكَ، وَخَفِي مَكْرُكَ، وَظَهَرَ اَمْرُكَ وَغَلَبَ قَهْرُكَ، وَجَرَتْ قُدْرَتُكَ، وَلا يُمْكِنُ الْفِرارُ مِنْ حُكُومَتِكَ.\nاَللّهُمَّ لا أجِدُ لِذُنُوبي غافِراً، وَلا لِقَبائِحي ساتِراً، وَلا لِشَيء مِنْ عَمَلِي الْقَبيحِ بِالْحَسَنِ مُبَدِّلاً غَيْرَكَ، لا اِلهَ إلاّ أنْتَ، سُبْحانَكَ وَبِحَمْدِكَ، ظَلَمْتُ نَفْسي، وَتَجَرَّأْتُ بِجَهْلي، وَسَكَنْتُ إلى قَديمِ ذِكْرِكَ لي وَمَنِّكَ عَلَيَّ.\nاَللّهُمَّ مَوْلاي كَمْ مِنْ قَبيح سَتَرْتَهُ، وَكَمْ مِنْ فادِح مِنَ الْبَلاءِ اَقَلْتَهُ، وَكَمْ مِنْ عِثارٍ وَقَيْتَهُ، وَكَمْ مِنْ مَكْرُوهٍ دَفَعْتَهُ، وَكَمْ مِنْ ثَناءٍ جَميلٍ لَسْتُ اَهْلاً لَهُ نَشَرْتَهُ.\nاَللّهُمَّ عَظُمَ بَلائي، وَاَفْرَطَ بي سُوءُ حالي، وَقَصُرَتْ بي اَعْمالي، وَقَعَدَتْ بي اَغْلالي، وَحَبَسَني عَنْ نَفْعي بُعْدُ اَمَلي، وَخَدَعَتْنِي الدُّنْيا بِغُرُورِها، وَنَفْسي بِجِنايَتِها، وَمِطالي يا سَيِّدي فَأَسْأَلُكَ بِعِزَّتِكَ أن لا يَحْجُبَ عَنْكَ دُعائي سُوءُ عَمَلي وَفِعالي، وَلا تَفْضَحْني بِخَفِي مَا اطَّلَعْتَ عَلَيْهِ مِنْ سِرّي، وَلا تُعاجِلْني بِالْعُقُوبَةِ عَلى ما عَمِلْتُهُ في خَلَواتي مِنْ سُوءِ فِعْلي وَإساءَتي، وَدَوامِ تَفْريطي وَجَهالَتي، وَكَثْرَةِ شَهَواتي وَغَفْلَتي، وَكُنِ اللّهُمَّ بِعِزَّتِكَ لي في كُلِّ الأحوالِ رَؤوفاً، وَعَلَي في جَميعِ الاُْمُورِ عَطُوفاً.\nاِلهي وَرَبّي مَنْ لي غَيْرُكَ أَسْأَلُهُ كَشْفَ ضُرّي، وَالنَّظَرَ في اَمْري، اِلهي وَمَوْلاي اَجْرَيْتَ عَلَي حُكْماً اِتَّبَعْتُ فيهِ هَوى نَفْسي، وَلَمْ اَحْتَرِسْ فيهِ مِنْ تَزْيينِ عَدُوّي، فَغَرَّني بِما اَهْوى وَاَسْعَدَهُ عَلى ذلِكَ الْقَضاءُ، فَتَجاوَزْتُ بِما جَرى عَلَيَّ مِنْ ذلِكَ بَعْضَ حُدُودِكَ، وَخالَفْتُ بَعْضَ اَوامِرِكَ، فَلَكَ الْحَمْدُ عَلي في جَميعِ ذلِكَ، وَلا حُجَّةَ لي فيما جَرى عَلَيَّ فيهِ قَضاؤُكَ، وَاَلْزَمَني حُكْمُكَ وَبَلاؤُكَ.\nوَقَدْ اَتَيْتُكَ يا اِلهي بَعْدَ تَقْصيري وَاِسْرافي عَلى نَفْسي مُعْتَذِراً نادِماً مُنْكَسِراً مُسْتَقيلاً مُسْتَغْفِراً مُنيباً مُقِرّاً مُذْعِناً مُعْتَرِفاً، لا أجِدُ مَفَرّاً مِمّا كانَ مِنّي، وَلا مَفْزَعاً اَتَوَجَّهُ إليه في أَمْري، غَيْرَ قَبُولِكَ عُذْري، وَاِدْخالِكَ اِيّايَ في سَعَة رَحْمَتِكَ.\nاَللّهُمَّ فَاقْبَلْ عُذْري، وَارْحَمْ شِدَّةَ ضُرّي، وَفُكَّني مِنْ شَدِّ وَثاقي.\nيا رَبِّ ارْحَمْ ضَعْفَ بَدَني، وَرِقَّةَ جِلْدي، وَدِقَّةَ عَظْمي، يا مَنْ بَدَأَ خَلْقي وَذِكْري وَتَرْبِيَتي وَبِرّي وَتَغْذِيَتي هَبْني لاِبْتِداءِ كَرَمِكَ، وَسالِفِ بِرِّكَ بي.\nيا اِلهي وَسَيِّدي وَرَبّي، اَتُراكَ مُعَذِّبي بِنارِكَ بَعْدَ تَوْحيدِكَ، وَبَعْدَ مَا انْطَوى عَلَيْهِ قَلْبي مِنْ مَعْرِفَتِكَ، وَلَهِجَ بِهِ لِساني مِنْ ذِكْرِكَ، وَاعْتَقَدَهُ ضَميري مِنْ حُبِّكَ، وَبَعْدَ صِدْقِ اعْتِرافي وَدُعائي خاضِعاً لِرُبُوبِيَّتِكَ، هَيْهاتَ أنْتَ اَكْرَمُ مِنْ أنْ تُضَيِّعَ مَنْ رَبَّيْتَهُ، أوْ تُبَعِّدَ مَنْ أدْنَيْتَهُ، اَوْ تُشَرِّدَ مَنْ آوَيْتَهُ، اَوْ تُسَلِّمَ اِلَى الْبَلاءِ مَنْ كَفَيْتَهُ وَرَحِمْتَهُ، وَلَيْتَ شِعْري يا سَيِّدي وَاِلهي وَمَوْلايَ، اَتُسَلِّطُ النّارَ عَلى وُجُوه خَرَّتْ لِعَظَمَتِكَ ساجِدَةً، وَعَلى اَلْسُن نَطَقَتْ بِتَوْحيدِكَ صادِقَةً، وَبِشُكْرِكَ مادِحَةً، وَعَلى قُلُوبٍ اعْتَرَفَتْ بِإلهِيَّتِكَ مُحَقِّقَةً، وَعَلى ضَمائِرَ حَوَتْ مِنَ الْعِلْمِ بِكَ حَتّى صارَتْ خاشِعَةً، وَعَلى جَوارِحَ سَعَتْ إلى أوْطانِ تَعَبُّدِكَ طائِعَةً، وَاَشارَتْ بِاسْتِغْفارِكَ مُذْعِنَةً، ما هكَذَا الظَّنُّ بِكَ، وَلا اُخْبِرْنا بِفَضْلِكَ عَنْكَ.\nيا كَريمُ يا رَبِّ وَاَنْتَ تَعْلَمُ ضَعْفي عَنْ قَليل مِنْ بَلاءِ الدُّنْيا وَعُقُوباتِها، وَما يَجْري فيها مِنَ الْمَكارِهِ عَلى أهْلِها، عَلى أنَّ ذلِكَ بَلاءٌ وَمَكْرُوهٌ قَليلٌ مَكْثُهُ، يَسيرٌ بَقاؤُهُ، قَصيرٌ مُدَّتُهُ، فَكَيْفَ احْتِمالي لِبَلاءِ الآخِرَةِ، وَجَليلِ وُقُوعِ الْمَكارِهِ فيها، وَهُوَ بَلاءٌ تَطُولُ مُدَّتُهُ، وَيَدُومُ مَقامُهُ، وَلا يُخَفَّفُ عَنْ اَهْلِهِ، لاَِنَّهُ لا يَكُونُ إلاّ عَنْ غَضَبِكَ وَاْنتِقامِكَ وَسَخَطِكَ، وَهذا ما لا تَقُومُ لَهُ السَّماواتُ وَالأرْضُ، يا سَيِّدِي فَكَيْفَ لي وَأنَا عَبْدُكَ الضَّعيفُ الذَّليلُ الْحَقيرُ الْمِسْكينُ الْمُسْتَكينُ.\nيا اِلهي وَرَبّي وَسَيِّدِي وَمَوْلايَ لأيِّ الاُْمُورِ اِلَيْكَ اَشْكُو، وَلِما مِنْها أضِجُّ وَاَبْكي، لأليمِ الْعَذابِ وَشِدَّتِهِ، أمْ لِطُولِ الْبَلاءِ وَمُدَّتِهِ، فَلَئِنْ صَيَّرْتَني لِلْعُقُوباتِ مَعَ أعْدائِكَ، وَجَمَعْتَ بَيْني وَبَيْنَ أهْلِ بَلائِكَ، وَفَرَّقْتَ بَيْني وَبَيْنَ أحِبّائِكَ وَأوْليائِكَ، فَهَبْني يا إلهي وَسَيِّدِي وَمَوْلايَ وَرَبّي صَبَرْتُ عَلى عَذابِكَ، فَكَيْفَ اَصْبِرُ عَلى فِراقِكَ، وَهَبْني صَبَرْتُ عَلى حَرِّ نارِكَ، فَكَيْفَ اَصْبِرُ عَنِ النَّظَرِ إلى كَرامَتِكَ، أمْ كَيْفَ أسْكُنُ فِي النّارِ وَرَجائي عَفْوُكَ، فَبِعِزَّتِكَ يا سَيِّدي وَمَوْلايَ اُقْسِمُ صادِقاً لَئِنْ تَرَكْتَني ناطِقاً لاَِضِجَّنَّ إلَيْكَ بَيْنَ أهْلِها ضَجيجَ الآمِلينَ، وَلأصْرُخَنَّ إلَيْكَ صُراخَ الْمَسْتَصْرِخينَ، وَلأبْكِيَنَّ عَلَيْكَ بُكاءَ الْفاقِدينَ، وَلاَُنادِيَنَّكَ اَيْنَ كُنْتْ ( كُنْتُ ) يا وَلِيَّ الْمُؤْمِنينَ، يا غايَةَ آمالِ الْعارِفينَ، يا غِياثَ الْمُسْتَغيثينَ، يا حَبيبَ قُلُوبِ الصّادِقينَ، وَيا اِلهَ الْعالَمينَ.\nأفَتُراكَ سُبْحانَكَ يا إلهي وَبِحَمْدِكَ تَسْمَعُ فيها صَوْتَ عَبْد مُسْلِم سُجِنَ فيها بِمُخالَفَتِهِ، وَذاقَ طَعْمَ عَذابِها بِمَعْصِيَتِهِ، وَحُبِسَ بَيْنَ اَطْباقِها بِجُرْمِهِ وَجَريرَتِهِ، وَهُوَ يَضِجُّ إلَيْكَ ضَجيجَ مُؤَمِّل لِرَحْمَتِكَ، وَيُناديكَ بِلِسانِ أهْلِ تَوْحيدِكَ، وَيَتَوَسَّلُ إلَيْكَ بِرُبُوبِيَّتِكَ، يا مَوْلايَ فَكَيْفَ يَبْقى فِي الْعَذابِ وَهُوَ يَرْجُو ما سَلَفَ مِنْ حِلْمِكَ، أَمْ كَيْفَ تُؤْلِمُهُ النّارُ وَهُوَ يَأْمُلُ فَضْلَكَ وَرَحْمَتَكَ، اَمْ كَيْفَ يُحْرِقُهُ لَهيبُها وَأنْتَ تَسْمَعُ صَوْتَهُ وَتَرى مَكانَه، اَمْ كَيْفَ يَشْتَمِلُ عَلَيْهِ زَفيرُها وَأنْتَ تَعْلَمُ ضَعْفَهُ، اَمْ كَيْفَ يَتَقَلْقَلُ بَيْنَ اَطْباقِها وَأنْتَ تَعْلَمُ صِدْقَهُ، اَمْ كَيْفَ تَزْجُرُهُ زَبانِيَتُها وَهُوَ يُناديكَ يا رَبَّهُ، اَمْ كَيْفَ يَرْجُو فَضْلَكَ في عِتْقِهِ مِنْها فَتَتْرُكُهُ فيها، هَيْهاتَ ما ذلِكَ الظَّنُ بِكَ، وَلاَ الْمَعْرُوفُ مِنْ فَضْلِكَ، وَلا مُشْبِهٌ لِما عامَلْتَ بِهِ الْمُوَحِّدينَ مِنْ بِرِّكَ وَاِحْسانِكَ، فَبِالْيَقينِ اَقْطَعُ لَوْ لا ما حَكَمْتَ بِهِ مِنْ تَعْذيبِ جاحِديكَ، وَقَضَيْتَ بِهِ مِنْ اِخْلادِ مُعانِدِيكَ، لَجَعَلْتَ النّارَ كُلَّها بَرْداً وَسَلاماً، وَما كانَ لأحَد فيها مَقَرّاً وَلا مُقاماً، لكِنَّكَ تَقَدَّسَتْ أسْماؤُكَ اَقْسَمْتَ أنْ تَمْلاََها مِنَ الْكافِرينَ مِنَ الْجِنَّةِ وَالنّاسِ اَجْمَعينَ، وَأنْ تُخَلِّدَ فيهَا الْمُعانِدينَ، وَأنْتَ جَلَّ ثَناؤُكَ قُلْتَ مُبْتَدِئاً، وَتَطَوَّلْتَ بِالإنْعامِ مُتَكَرِّماً، اَفَمَنْ كانَ مُؤْمِناً كَمَنْ كانَ فاسِقاً لا يَسْتَوُونَ.\nإلهي وَسَيِّدى فَأَسْأَلُكَ بِالْقُدْرَةِ الَّتي قَدَّرْتَها، وَبِالْقَضِيَّةِ الَّتي حَتَمْتَها وَحَكَمْتَها، وَغَلَبْتَ مَنْ عَلَيْهِ اَجْرَيْتَها، أنْ تَهَبَ لي في هذِهِ اللَّيْلَةِ وَفي هذِهِ السّاعَةِ كُلَّ جُرْم اَجْرَمْتُهُ، وَكُلَّ ذَنْب اَذْنَبْتُهُ، وَكُلَّ قَبِيح أسْرَرْتُهُ، وَكُلَّ جَهْل عَمِلْتُهُ، كَتَمْتُهُ أوْ اَعْلَنْتُهُ، أخْفَيْتُهُ أوْ اَظْهَرْتُهُ، وَكُلَّ سَيِّئَة أمَرْتَ بِاِثْباتِهَا الْكِرامَ الْكاتِبينَ الَّذينَ وَكَّلْتَهُمْ بِحِفْظِ ما يَكُونُ مِنّي، وَجَعَلْتَهُمْ شُهُوداً عَلَيَّ مَعَ جَوارِحي، وَكُنْتَ أنْتَ الرَّقيبَ عَلَيَّ مِنْ وَرائِهِمْ، وَالشّاهِدَ لِما خَفِيَ عَنْهُمْ، وَبِرَحْمَتِكَ اَخْفَيْتَهُ، وَبِفَضْلِكَ سَتَرْتَهُ، وَأنْ تُوَفِّرَ حَظّي مِنْ كُلِّ خَيْر اَنْزَلْتَهُ أوْ اِحْسان فَضَّلْتَهُ، أوْ بِرٍّ نَشَرْتَهُ، أوْ رِزْق بَسَطْتَهُ، أوْ ذَنْب تَغْفِرُهُ، أوْ خَطَأ تَسْتُرُهُ، يا رَبِّ يا رَبِّ يا رَبِّ.\nيا اِلهي وَسَيِّدي وَمَوْلايَ وَمالِكَ رِقّي، يا مَنْ بِيَدِهِ ناصِيَتي، يا عَليماً بِضُرّي وَمَسْكَنَتي، يا خَبيراً بِفَقْري وَفاقَتي، يا رَبِّ يا رَبِّ يا رَبِّ، أَسْأَلُكَ بِحَقِّكَ وَقُدْسِكَ، وَاَعْظَمِ صِفاتِكَ وَاَسْمائِكَ، أنْ تَجْعَلَ اَوْقاتي مِنَ اللَّيْلِ وَالنَّهارِ بِذِكْرِكَ مَعْمُورَةً، وَبِخِدْمَتِكَ مَوْصُولَةً، وَاَعْمالي عِنْدَكَ مَقْبُولَةً، حَتّى تَكُونَ أعْمالي وَأوْرادي كُلُّها وِرْداً واحِداً، وَحالي في خِدْمَتِكَ سَرْمَداً.\nيا سَيِّدي يا مَنْ عَلَيْهِ مُعَوَّلي، يا مَنْ اِلَيْهِ شَكَوْتُ أحْوالي، يا رَبِّ يا رَبِّ يا رَبِّ، قَوِّ عَلى خِدْمَتِكَ جَوارِحي، وَاشْدُدْ عَلَى الْعَزيمَةِ جَوانِحي، وَهَبْ لِيَ الْجِدَّ في خَشْيَتِكَ، وَالدَّوامَ فِي الاِْتِّصالِ بِخِدْمَتِكَ، حَتّى أسْرَحَ إلَيْكَ في مَيادينِ السّابِقينَ، وَاُسْرِعَ إلَيْكَ فِي الْبارِزينَ، وَاَشْتاقَ إلى قُرْبِكَ فِي الْمُشْتاقينَ، وَاَدْنُوَ مِنْكَ دُنُوَّ الُْمخْلِصينَ، وَاَخافَكَ مَخافَةَ الْمُوقِنينَ، وَاَجْتَمِعَ في جِوارِكَ مَعَ الْمُؤْمِنينَ.\nاَللّهُمَّ وَمَنْ اَرادَني بِسُوء فَاَرِدْهُ، وَمَنْ كادَني فَكِدْهُ، وَاجْعَلْني مِنْ أحْسَنِ عَبيدِكَ نَصيباً عِنْدَكَ، وَاَقْرَبِهِمْ مَنْزِلَةً مِنْكَ، وَاَخَصِّهِمْ زُلْفَةً لَدَيْكَ، فَاِنَّهُ لا يُنالُ ذلِكَ إلاّ بِفَضْلِكَ، وَجُدْ لي بِجُودِكَ، وَاعْطِفْ عَلَيَّ بِمَجْدِكَ، وَاحْفَظْني بِرَحْمَتِكَ، وَاجْعَلْ لِساني بِذِكْرِكَ لَهِجَاً، وَقَلْبي بِحُبِّكَ مُتَيَّماً، وَمُنَّ عَلَيَّ بِحُسْنِ اِجابَتِكَ، وَاَقِلْني عَثْرَتي، وَاغْفِرْ زَلَّتي، فَاِنَّكَ قَضَيْتَ عَلى عِبادِكَ بِعِبادَتِكَ، وَاَمَرْتَهُمْ بِدُعائِكَ، وَضَمِنْتَ لَهُمُ الإجابَةَ، فَاِلَيْكَ يا رَبِّ نَصَبْتُ وَجْهي، وَاِلَيْكَ يا رَبِّ مَدَدْتُ يَدي، فَبِعِزَّتِكَ اسْتَجِبْ لي دُعائي، وَبَلِّغْني مُنايَ، وَلا تَقْطَعْ مِنْ فَضْلِكَ رَجائي، وَاكْفِني شَرَّ الْجِنِّ وَالإنْسِ مِنْ اَعْدائي.\nيا سَريعَ الرِّضا اِغْفِرْ لِمَنْ لا يَمْلِكُ إلاّ الدُّعاءَ، فَاِنَّكَ فَعّالٌ لِما تَشاءُ، يا مَنِ اسْمُهُ دَواءٌ وَذِكْرُهُ شِفاءٌ وَطاعَتُهُ غِنىً، اِرْحَمْ مَنْ رَأْسُ مالِهِ الرَّجاءُ، وَسِلاحُهُ الْبُكاءُ، يا سابِغَ النِّعَمِ، يا دافِعَ النِّقَمِ، يا نُورَ الْمُسْتَوْحِشينَ فِي الظُّلَمِ، يا عالِماً لا يُعَلَّمُ، صَلِّ عَلى مُحَمَّد وَآلِ مُحَمَّد، وَافْعَلْ بي ما أنْتَ اَهْلُهُ، وَصَلَّى اللهُ عَلى رَسُولِهِ وَالأَئِمَّةِ الْمَيامينَ مِنْ آلِهِ، وَسَلَّمَ تَسْليماً كَثيراً.", "source": "رواه الشيخ الطوسي في مصباح المتهجد وابن طاووس في إقبال الأعمال، وعلّمه أمير المؤمنين (ع) لكميل بن زياد. النص من منتدى الكفيل (forums.alkafeel.net) ناقلاً عن مفاتيح الجنان، فراجعه على نسختك."}};BASE.forEach(x=>{if(FX2[x.id])Object.assign(x,FX2[x.id])});
const FX3={"z1": {"text": "السَّلام عَلَيْكَ يَا أبَا عَبْدِ اللهِ، السَّلام عَلَيْكَ يَا ابْنَ رَسُولِ اللهِ، السَّلام عَلَيْكَ يَا ابْنَ أمِيرِ المُؤْمِنينَ، وَابْنَ سَيِّدِ الوَصِيِّينَ، السَّلام عَلَيْكَ يَا ابْنَ فاطِمَةَ الزّهراءِ سَيِّدَةِ نِساءِ العالَمِينَ، السَّلام عَلَيْكَ يَا ثَارَ اللهِ وابْنَ ثارِهِ وَالْوِتْرَ المَوْتُورَ، السَّلام عَلَيْكَ وَعَلَى الأرواحِ الّتي حَلّتْ بِفِنائِكَ، وَأنَاخَتْ بِرحْلِك عَلَيْكُمْ مِنّي جَميعاً سَلامُ اللهِ أبَداً ما بَقِيتُ وَبَقِيَ الليْلُ وَالنَّهارُ.\nيَا أبَا عَبْدِ اللهِ، لَقَدْ عَظُمَتِ الرَّزِيَّةُ، وجَلّتْ وعَظُمَتْ المُصِيبَةُ بِكَ عَلَيْنا وَعَلَى جَمِيعِ أهْلِ الإسلام، وَجَلَّتْ وَعَظُمَتْ مُصِيبَتُكَ فِي السَّمَوَاتِ عَلَى جَمِيعِ أهْلِ السَّمَوَاتِ، فَلَعَنَ اللهُ اُمَّةً أسَّسَتْ أساسَ الظُّلْمِ وَالجَوْرِ عَلَيْكُمْ أهْلَ البَيْتِ، وَلَعَنَ اللهُ اُمَّةً دَفَعَتْكُمْ عَنْ مَقامِكُمْ وَأزالَتْكُمْ عَنْ مَراتِبِكُمُ الّتِي رَتَّبَكُمُ اللهُ فِيها، وَلَعَنَ اللهُ اُمَّةً قَتَلَتْكُمْ، وَلَعَنَ اللهُ الْمُمَهِّدِينَ لَهُمْ بِالتَّمْكِينِ مِنْ قِتالِكُمْ، بَرِئْتُ إلى اللهِ وَإلَيْكُمْ مِنْهُمْ وَمِنْ أشْياعِهِمْ وَأتْباعِهِمْ وَأوْلِيائِهِمْ.\nيَا أبَا عَبْدِ اللهِ، إنِّي سِلْمٌ لِمَنْ سالَمَكُمْ، وَحَرْبٌ لِمَنْ حارَبَكُمْ وَوليٌ لِمَنْ والاكُم وعدوٌّ لِمَنْ عَاداكُمْ إلى يَوْمِ القِيامَةِ، وَلَعَنَ اللهُ آل زِيَاد وَآلَ مَرْوانَ، وَلَعَنَ اللهُ بَنِي اُمَيَّةَ قاطِبَةً، وَلَعَنَ اللهُ ابْنَ مَرْجانَةَ، وَلَعَنَ اللهُ عُمَرَ بْنَ سَعْد، وَلَعَنَ اللهُ شِمْراً، وَلَعَنَ اللهُ اُمَّةً أسْرَجَتْ وَألْجَمَتْ وَتَهيّأتْ وَتَنَقَّبَتْ لِقِتالِكَ، بِأبِي أنْتَ وَاُمِّي لَقَدْ عَظُمَ مُصابِي بِكَ، فَأسْالُ اللهَ الّذِي أكْرَمَ مَقامَكَ، وَأكْرَمَنِي بِكَ، أنْ يَرْزُقَني طَلَبَ ثارِكَ مَعَ إمام مَنْصُور مِنْ أهْلِ بَيْتِ مُحَمَّد صَلّى الله عَلَيْهِ وَآلِهِ.\nاللهمّ اجْعَلْني عِنْدَكَ وَجِيهاً بِالحُسَيْنِ عَلَيهِ السَّلام فِي الدُّنْيا وَالآخِرَةِ مِنَ المقَرّبينْ.\nيَا أبَا عَبْدِ اللهِ، إنِّي أتَقَرَّبُ إلى اللهِ تعالى، وَإلَى رَسُولِهِ، وَإلى أمِيرِ المُؤْمِنينَ، وَإلَى فاطِمَةَ، وإلى الحَسَنِ وَإلَيْكَ بِمُوالاتِكَ، ومُوالاةِ أَوليائِك وَبِالْبَرَاءَةِ مِمَّنْ قَاتَلَكَ وَنَصبَ لَكَ الحَربَ، وبالْبَرَاءةِ مِمَّنْ أسَّسَ أساسَ الظُّلْمِ وَالجَوْرِ عَلَيْكُمْ، وَعلى أشياعِكُم وَأبْرَأُ إلى اللهِ وَإلى رَسُولِهِ وَبِالبراءِةِ مِمَّنْ أسَّسَ أساسَ ذلِكَ، وَبَنى عَلَيْهِ بُنْيانَهُ، وَجَرَى في ظُلْمِهِ وَجَوْرِهِ عَلَيْكُمْ وَعَلَى أشْياعِكُمْ، بَرِئْتُ إلى اللهِ وَإلَيْكُمْ مِنْهُمْ، وَأتَقَرَّبُّ إلى اللهِ وَإلى رَسولِهِ ثُمَّ إلَيْكُمْ بِمُوالاتِكُم وَمُوالاةِ وَلِيِّكُمْ، وَبِالْبَرَاءَةِ مِنْ أعْدائِكُمْ، وَالنَّاصِبِينَ لَكُم الحَرْبَ، وَبِالبَرَاءَةِ مِنْ أشْياعِهِمْ وَأتْباعِهِمْ، يا أبا عَبدِ الله إنِّي سِلْمٌ لِمَنْ سالَمَكُمْ، وَحَرْبٌ لِمَنْ حارَبَكُمْ، وَوَلِيٌّ لِمَنْ والاكُمْ، وَعَدُوٌّ لِمَنْ عاداكُمْ، فَأسْألُ اللهَ الّذِي أكْرَمَني بِمَعْرِفَتِكُمْ، وَمَعْرِفَةِ أوْلِيائِكُمْ، وَرَزَقَني البَراءَةَ مِنْ أعْدائِكُمْ، أنْ يَجْعَلَني مَعَكُمْ في الدُّنْيا وَالآخِرَةِ، وَأنْ يُثَبِّتَ لي عِنْدَكُمْ قَدَمَ صِدْق في الدُّنْيا وَالآخِرَةِ، وَأسْألُهُ أنْ يُبَلِّغَنِي الْمقامَ الْمَحْمُودَ لَكُمْ عِنْدَ اللهِ، وَأنْ يَرْزُقَنِي طَلَبَ ثَارِي مَعَ إمَام مَهْدِيٍّ ظَاهِر نَاطِق بالحقِّ مِنْكُمْ، وَأسْألُ اللهَ بِحَقِّكُمْ وَبِالشَّأنِ الَّذِي لَكُمْ عِنْدَهُ أنْ يُعْطِيَنِي بِمُصابِي بِكُمْ أفْضَلَ ما يُعْطِي مصاباً بِمُصِيبَتِهِ، يا لَها منْ مُصِيبَة مَا أعْظَمَها وَأعْظَمَ رَزِيّتهَا فِي الإسلام وَفِي جَمِيعِ أهلِ السَّموَاتِ وَالارْضِ.\nاللهُمَّ اجْعَلْني في مَقامِي هذا مِمَّن تَنالُهُ مِنْكَ صَلَواتٌ وَرَحْمَةٌ وَمَغْفِرَةٌ.\nاللهُمَّ اجْعَلْ مَحْيايَ مَحْيا مُحَمَّد وَآلِ مُحَمَّد، وَمَماتي مَماتَ مُحَمَّد وَآل مُحَمَّد.\nاللهُمَّ إنَّ هَذا يَوْمٌ تَبَرَّكَتْ بِهِ بَنُو اُمَيَّةَ وَابْنُ آكِلَةِ الاكْبادِ، اللعِينُ بْنُ اللعِينِ عَلَى لِسانِكَ وَلِسانِ نَبِيِّكَ صَلّى الله عَلَيْهِ وَآلِهِ في كُلِّ مَوْطِن وَمَوْقِف وَقَفَ فِيهِ نَبيُّكَ - صَلّى الله عَلَيْهِ وَآلِهِ -.\nاللهُمَّ الْعَنْ أبَا سُفْيانَ وَمُعَاوِيَةَ وَيَزيدَ بْنَ مُعَاوِيَةَ وآلَ مَرْوَانَ عَلَيْهِمْ مِنْكَ اللعْنَةُ أبَدَ الآبِدِينَ، وَهذا يَوْمٌ فَرِحَتْ بِهِ آلُ زِيَاد وَآلُ مَرْوانَ عَليهِمُ اللَّعْنةُ بِقَتْلِهِمُ الحُسَيْنَ عَلَيْهِ السَّلام، اللهُمَّ فَضاعِفْ عَلَيْهِمُ اللعْنَ وَالعَذابَ الأليم.\nاللهُمَّ إنِّي أتَقَرَّبُّ إلَيْكَ في هذَا اليَوْمِ، وَفِي مَوْقِفِي هَذا، وَأيَّامِ حَيَاتِي بِالبَرَاءَةِ مِنْهُمْ، وَاللعْنَةِ عَلَيْهِمْ، وَبِالْمُوالاةِ لِنَبِيِّكَ وَآلِ نَبِيِّكَ عَلَيِه وعَلَيْهِمُ السَّلام.\nثمّ يقول : اللهُمَّ الْعَنْ أوّلَ ظالِم ظَلَمَ حَقَّ مُحَمَّد وَآلِ مُحَمَّد، وَآخِرَ تَابِع لَهُ عَلَى ذلِكَ، اللهُمَّ الْعَنِ العِصابَةَ الَّتِي جاهَدَتِ الْحُسَيْنَ عَلَيْهِ السَّلام وَشايَعَتْ وَبايَعَتْ وَتابَعَتْ عَلَى قَتْلِهِ. اللهُمَّ الْعَنْهم جَميعاً ( يقول ذلك مائة مرّة ).\nثمّ يقول : السَّلام عَلَيْكَ يَا أبا عَبْدِ اللهِ وَعلَى الأرواحِ الّتي حَلّتْ بِفِنائِكَ، وَأنَاخَت برَحْلِك عَلَيْكَ مِنِّي سَلامُ اللهِ أبَداً مَا بَقِيتُ وَبَقِيَ الليْلُ وَالنَّهارُ، وَلا جَعَلَهُ اللهُ آخِرَ العَهْدِ مِنِّي لِزِيَارَتِكُمْ، أهْلَ البَيتِ السَّلام عَلَى الحُسَيْن، وَعَلَى عَليِّ بْنِ الحُسَيْنِ، وَعَلَى أوْلادِ الحُسَيْنِ، وَعَلَى أصْحابِ الحُسَينِ الذينَ بَذَلُوا مُهَجَهُم دُونَ الحُسين ( يقول ذلك مائة مرّة ).\nثمّ يقول : اللهمَّ خُصَّ أنْتَ أوّلَ ظالم بِاللّعْنِ مِنِّي، وَابْدَأْ بِهِ أوّلاً، ثُمَّ الثَّانِي، وَالثَّالِثَ وَالرَّابِع، اللهُمَّ الْعَنْ يزِيَدَ خامِساً، وَالْعَنْ عُبَيْدَ اللهِ بْنَ زِيَاد وَابْنَ مَرْجانَةَ وَعُمَرَ بْنَ سَعْد وَشِمْراً وَآلَ أبي سُفْيانَ وَآلَ زِيَاد وآلَ مَرْوانَ إلَى يَوْمِ القِيامَةِ.\nثم تسجد وتقول : اللهمَّ لَكَ الحَمْدُ حَمْدَ الشَّاكِرينَ لَكَ عَلَى مُصابِهِمْ، الحَمْدُ للهِ عَلَى عَظِيمِ رَزِيّتي.\nاللهُمَّ ارْزُقْني شَفاعَةَ الحُسَيْن عَلَيهِ السَّلام يَوْمَ الوُرُودِ، وَثَبِّتْ لي قَدَمَ صِدْق عِنْدَكَ مَعَ الحُسَيْنِ وَأصْحابِ الحُسَيْن الّذِينَ بَذَلُوا مُهَجَهُمْ دُونَ الْحُسَيْن عَلَيْهِ السَّلام.\nقال علقمة : قال أبو جعفر ( عليه السلام ) وإن استطعت أن تزوره في كل يوم بهذه الزيارة من دارك فافعل فلك ثواب جميع ذلك.", "source": "النص من منتدى الكفيل (forums.alkafeel.net) وهو منشور في منتدى لا طبعة محققة، وحركاته غير منتظمة في مواضع، فراجعه على مفاتيح الجنان. الزيارة مروية عن الإمام الباقر (ع) برواية علقمة بن محمد الحضرمي. هذا نص الزيارة نفسها فقط، بدون الصلاة بعدها ودعاء علقمة."}};BASE.forEach(x=>{if(FX3[x.id])Object.assign(x,FX3[x.id])});
BASE.push({"id": "d16", "cat": "d", "title": "دعاء أهل الثغور", "text": "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَحَصِّنْ ثُغُورَ الْمُسْلِمِينَ بِعِزَّتِكَ، وَأَيِّدْ حُمَاتَهَا بِقُوَّتِكَ، وَأَسْبِغْ عَطَايَاهُمْ مِنْ جِدَتِكَ.\nاللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَكَثِّرْ عِدَّتَهُمْ، وَاشْحَذْ أَسْلِحَتَهُمْ، وَاحْرُسْ حَوْزَتَهُمْ، وَامْنَعْ حَوْمَتَهُمْ، وَأَلِّفْ جَمْعَهُمْ، وَدَبِّرْ أَمْرَهُمْ، وَوَاتِرْ بَيْنَ مِيَرِهِمْ، وَتَوَحَّدْ بِكِفَايَةِ مُؤَنِهِمْ، وَاعْضُدْهُمْ بِالنَّصْرِ، وَأَعِنْهُمْ بِالصَّبْرِ، وَالْطُفْ لَهُمْ فِي الْمَكْرِ.\nاللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَعَرِّفْهُمْ مَا يَجْهَلُونَ، وَعَلِّمْهُمْ مَا لَا يَعْلَمُونَ، وَبَصِّرْهُمْ مَا لَا يُبْصِرُونَ.\nاللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَآلِهِ، وَأَنْسِهِمْ عِنْدَ لِقَائِهِمُ الْعَدُوَّ ذِكْرَ دُنْيَاهُمُ الْخَدَّاعَةِ الْغَرُورِ، وَامْحُ عَنْ قُلُوبِهِمْ خَطَرَاتِ الْمَالِ الْفَتُونِ، وَاجْعَلِ الْجَنَّةَ نُصْبَ أَعْيُنِهِمْ، وَلَوِّحْ مِنْهَا لِأَبْصَارِهِمْ مَا أَعْدَدْتَ فِيهَا مِنْ مَسَاكِنِ الْخُلْدِ وَمَنَازِلِ الْكَرَامَةِ وَالْحُورِ الْحِسَانِ وَالْأَنْهَارِ الْمُطَّرِدَةِ بِأَنْوَاعِ الْأَشْرِبَةِ وَالْأَشْجَارِ الْمُتَدَلِّيَةِ بِصُنُوفِ الثَّمَرِ حَتَّى لَا يَهُمَّ أَحَدٌ مِنْهُمْ بِالْإِدْبَارِ، وَلَا يُحَدِّثَ نَفْسَهُ عَنْ قِرْنِهِ بِفِرَارٍ.\nاللَّهُمَّ افْلُلْ بِذَلِكَ عَدُوَّهُمْ، وَاقْلِمْ عَنْهُمْ أَظْفَارَهُمْ، وَفَرِّقْ بَيْنَهُمْ وَبَيْنَ أَسْلِحَتِهِمْ، وَاخْلَعْ وَثَائِقَ أَفْئِدَتِهِمْ، وَبَاعِدْ بَيْنَهُمْ وَبَيْنَ أَزْوِدَتِهِمْ، وَحَيِّرْهُمْ فِي سُبُلِهِمْ، وَضَلِّلْهُمْ عَنْ وَجْهِهِمْ، وَاقْطَعْ عَنْهُمُ الْمَدَدَ، وَانْقُصْ مِنْهُمُ الْعَدَدَ، وَامْلَأْ أَفْئِدَتَهُمُ الرُّعْبَ، وَاقْبِضْ أَيْدِيَهُمْ عَنِ الْبَسْطِ، وَاخْزِمْ أَلْسِنَتَهُمْ عَنِ النُّطْقِ، وَشَرِّدْ بِهِمْ مَنْ خَلْفَهُمْ وَنَكِّلْ بِهِمْ مَنْ وَرَاءَهُمْ، وَاقْطَعْ بِخِزْيِهِمْ أَطْمَاعَ مَنْ بَعْدَهُمْ.\nاللَّهُمَّ عَقِّمْ أَرْحَامَ نِسَائِهِمْ، وَيَبِّسْ أَصْلَابَ رِجَالِهِمْ، وَاقْطَعْ نَسْلَ دَوَابِّهِمْ وَأَنْعَامِهِمْ، لَا تَأْذَنْ لِسَمَائِهِمْ فِي قَطْرٍ، وَلَا لِأَرْضِهِمْ فِي نَبَاتٍ.\nاللَّهُمَّ وَقَوِّ بِذَلِكَ مِحَالَ أَهْلِ الْإِسْلَامِ، وَحَصِّنْ بِهِ دِيَارَهُمْ، وَثَمِّرْ بِهِ أَمْوَالَهُمْ، وَفَرِّغْهُمْ عَنْ مُحَارَبَتِهِمْ لِعِبَادَتِكَ، وَعَنْ مُنَابَذَتِهِمْ لِلْخَلْوَةِ بِكَ، حَتَّى لَا يُعْبَدَ فِي بِقَاعِ الْأَرْضِ غَيْرُكَ، وَلَا تُعَفَّرَ لِأَحَدٍ مِنْهُمْ جَبْهَةٌ دُونَكَ.\nاللَّهُمَّ اغْزُ بِكُلِّ نَاحِيَةٍ مِنَ الْمُسْلِمِينَ عَلَى مَنْ بِإِزَائِهِمْ مِنَ الْمُشْرِكِينَ، وَأَمْدِدْهُمْ بِمَلَائِكَةٍ مِنْ عِنْدِكَ مُرْدِفِينَ، حَتَّى يَكْشِفُوهُمْ إِلَى مُنْقَطَعِ التُّرَابِ قَتْلًا فِي أَرْضِكَ وَأَسْراً، أَوْ يُقِرُّوا بِأَنَّكَ أَنْتَ اللَّهُ الَّذِي لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ.\nاللَّهُمَّ وَاعْمُمْ بِذَلِكَ أَعْدَاءَكَ فِي أَقْطَارِ الْبِلَادِ مِنَ الْهِنْدِ وَالرُّومِ وَالتُّرْكِ وَالْخَزَرِ وَالْحَبَشِ وَالنُّوبَةِ وَالزَّنْجِ وَالسَّقَالِبَةِ وَالدَّيَالِمَةِ وَسَائِرِ أُمَمِ الشِّرْكِ، الَّذِينَ تَخْفَى أَسْمَاؤُهُمْ وَصِفَاتُهُمْ، وَقَدْ أَحْصَيْتَهُمْ بِمَعْرِفَتِكَ، وَأَشْرَفْتَ عَلَيْهِمْ بِقُدْرَتِكَ.\nاللَّهُمَّ اشْغَلِ الْمُشْرِكِينَ بِالْمُشْرِكِينَ عَنْ تَنَاوُلِ أَطْرَافِ الْمُسْلِمِينَ، وَخُذْهُمْ بِالنَّقْصِ عَنْ تَنَقُّصِهِمْ، وَثَبِّطْهُمْ بِالْفُرْقَةِ عَنِ الِاحْتِشَادِ عَلَيْهِمْ.\nاللَّهُمَّ أَخْلِ قُلُوبَهُمْ مِنَ الْأَمَنَةِ، وَأَبْدَانَهُمْ مِنَ الْقُوَّةِ، وَأَذْهِلْ قُلُوبَهُمْ عَنِ الِاحْتِيَالِ، وَأَوْهِنْ أَرْكَانَهُمْ عَنْ مُنَازَلَةِ الرِّجَالِ، وَجَبِّنْهُمْ عَنْ مُقَارَعَةِ الْأَبْطَالِ، وَابْعَثْ عَلَيْهِمْ جُنْداً مِنْ مَلَائِكَتِكَ بِبَأْسٍ مِنْ بَأْسِكَ كَفِعْلِكَ يَوْمَ بَدْرٍ، تَقْطَعُ بِهِ دَابِرَهُمْ وَتَحْصُدُ بِهِ شَوْكَتَهُمْ، وَتُفَرِّقُ بِهِ عَدَدَهُمْ.\nاللَّهُمَّ وَامْزُجْ مِيَاهَهُمْ بِالْوَبَاءِ، وَأَطْعِمَتَهُمْ بِالْأَدْوَاءِ، وَارْمِ بِلَادَهُمْ بِالْخُسُوفِ، وَأَلِحَّ عَلَيْهَا بِالْقُذُوفِ، وَافْرَعْهَا بِالْمُحُولِ، وَاجْعَلْ مِيَرَهُمْ فِي أَحَصِّ أَرْضِكَ وَأَبْعَدِهَا عَنْهُمْ، وَامْنَعْ حُصُونَهَا مِنْهُمْ، أَصِبْهُمْ بِالْجُوعِ الْمُقِيمِ وَالسُّقْمِ الْأَلِيمِ.\nاللَّهُمَّ وَأَيُّمَا غَازٍ غَزَاهُمْ مِنْ أَهْلِ مِلَّتِكَ، أَوْ مُجَاهِدٍ جَاهَدَهُمْ مِنْ أَتْبَاعِ سُنَّتِكَ لِيَكُونَ دِينُكَ الْأَعْلَى وَحِزْبُكَ الْأَقْوَى وَحَظُّكَ الْأَوْفَى فَلَقِّهِ الْيُسْرَ، وَهَيِّئْ لَهُ الْأَمْرَ، وَتَوَلَّهُ بِالنُّجْحِ، وَتَخَيَّرْ لَهُ الْأَصْحَابَ، وَاسْتَقْوِ لَهُ الظَّهْرَ، وَأَسْبِغْ عَلَيْهِ فِي النَّفَقَةِ، وَمَتِّعْهُ بِالنَّشَاطِ، وَأَطْفِ عَنْهُ حَرَارَةَ الشَّوْقِ، وَأَجِرْهُ مِنْ غَمِّ الْوَحْشَةِ، وَأَنْسِهِ ذِكْرَ الْأَهْلِ وَالْوَلَدِ.\nوَأْثُرْ لَهُ حُسْنَ النِّيَّةِ، وَتَوَلَّهُ بِالْعَافِيَةِ، وَأَصْحِبْهُ السَّلَامَةَ، وَأَعْفِهِ مِنَ الْجُبْنِ، وَأَلْهِمْهُ الْجُرْأَةَ، وَارْزُقْهُ الشِّدَّةَ، وَأَيِّدْهُ بِالنُّصْرَةِ، وَعَلِّمْهُ السِّيَرَ وَالسُّنَنَ، وَسَدِّدْهُ فِي الْحُكْمِ، وَاعْزِلْ عَنْهُ الرِّيَاءَ، وَخَلِّصْهُ مِنَ السُّمْعَةِ، وَاجْعَلْ فِكْرَهُ وَذِكْرَهُ وَظَعْنَهُ وَإِقَامَتَهُ، فِيكَ وَلَكَ.\nفَإِذَا صَافَّ عَدُوَّكَ وَعَدُوَّهُ فَقَلِّلْهُمْ فِي عَيْنِهِ، وَصَغِّرْ شَأْنَهُمْ فِي قَلْبِهِ، وَأَدِلْ لَهُ مِنْهُمْ، وَلَا تُدِلْهُمْ مِنْهُ، فَإِنْ خَتَمْتَ لَهُ بِالسَّعَادَةِ، وَقَضَيْتَ لَهُ بِالشَّهَادَةِ فَبَعْدَ أَنْ يَجْتَاحَ عَدُوَّكَ بِالْقَتْلِ، وَبَعْدَ أَنْ يَجْهَدَ بِهِمُ الْأَسْرُ، وَبَعْدَ أَنْ تَأْمَنَ أَطْرَافُ الْمُسْلِمِينَ، وَبَعْدَ أَنْ يُوَلِّيَ عَدُوُّكَ مُدْبِرِينَ.\nاللَّهُمَّ وَأَيُّمَا مُسْلِمٍ خَلَفَ غَازِياً أَوْ مُرَابِطاً فِي دَارِهِ، أَوْ تَعَهَّدَ خَالِفِيهِ فِي غَيْبَتِهِ، أَوْ أَعَانَهُ بِطَائِفَةٍ مِنْ مَالِهِ، أَوْ أَمَدَّهُ بِعِتَادٍ، أَوْ شَحَذَهُ عَلَى جِهَادٍ، أَوْ أَتْبَعَهُ فِي وَجْهِهِ دَعْوَةً، أَوْ رَعَى لَهُ مِنْ وَرَائِهِ حُرْمَةً، فَآجِرْ لَهُ مِثْلَ أَجْرِهِ وَزْناً بِوَزْنٍ وَمِثْلًا بِمِثْلٍ، وَعَوِّضْهُ مِنْ فِعْلِهِ عِوَضاً حَاضِراً يَتَعَجَّلُ بِهِ نَفْعَ مَا قَدَّمَ وَسُرُورَ مَا أَتَى بِهِ، إِلَى أَنْ يَنْتَهِيَ بِهِ الْوَقْتُ إِلَى مَا أَجْرَيْتَ لَهُ مِنْ فَضْلِكَ، وَأَعْدَدْتَ لَهُ مِنْ كَرَامَتِكَ.\nاللَّهُمَّ وَأَيُّمَا مُسْلِمٍ أَهَمَّهُ أَمْرُ الْإِسْلَامِ، وَأَحْزَنَهُ تَحَزُّبُ أَهْلِ الشِّرْكِ عَلَيْهِمْ فَنَوَى غَزْواً، أَوْ هَمَّ بِجِهَادٍ فَقَعَدَ بِهِ ضَعْفٌ، أَوْ أَبْطَأَتْ بِهِ فَاقَةٌ، أَوْ أَخَّرَهُ عَنْهُ حَادِثٌ، أَوْ عَرَضَ لَهُ دُونَ إِرَادَتِهِ مَانِعٌ فَاكْتُبِ اسْمَهُ فِي الْعَابِدِينَ، وَأَوْجِبْ لَهُ ثَوَابَ الْمُجَاهِدِينَ، وَاجْعَلْهُ فِي نِظَامِ الشُّهَدَاءِ وَالصَّالِحِينَ.\nاللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ وَآلِ مُحَمَّدٍ، صَلَاةً عَالِيَةً عَلَى الصَّلَوَاتِ، مُشْرِفَةً فَوْقَ التَّحِيَّاتِ، صَلَاةً لَا يَنْتَهِي أَمَدُهَا، وَلَا يَنْقَطِعُ عَدَدُهَا كَأَتَمِّ مَا مَضَى مِنْ صَلَوَاتِكَ عَلَى أَحَدٍ مِنْ أَوْلِيَائِكَ، إِنَّكَ الْمَنَّانُ الْحَمِيدُ الْمُبْدِئُ الْمُعِيدُ الْفَعَّالُ لِمَا تُرِيدُ.", "source": "الصحيفة السجادية، الدعاء رقم 27، للإمام زين العابدين (ع). النص من منتدى الكفيل (forums.alkafeel.net) بحركات منتظمة، فراجعه على نسختك من الصحيفة السجادية."});
const FX5={"d3": {"text": "اَللّـهُمَّ اِنّي اَفْتَتِحُ الثَّناءَ بِحَمْدِكَ، وَاَنْتَ مُسَدِّدٌ لِلصَّوابِ بِمَّنِكَ، وَاَيْقَنْتُ اَنَّكَ اَنْتَ اَرْحَمُ الرّاحِمينَ في مَوْضِعِ الْعَفْوِ وَالرَّحْمَةِ، وَاَشَدُّ الْمُعاقِبينَ في مَوْضِعِ النَّكالِ وَالنَّقِمَةِ، وَاَعْظَمُ الْمُتَجَبِّرِينَ في مَوْضِعِ الْكِبْرياءِ وَالْعَظَمَةِ،\nاَللّـهُمَّ اَذِنْتَ لي في دُعائِكَ وَمَسْأَلَتِكَ فَاسْمَعْ يا سَميعُ مِدْحَتي، وَاَجِبْ يا رَحيمُ دَعْوَتي، وَاَقِلْ يا غَفُورُ عَثْرَتي، فَكَمْ يا اِلهي مِنْ كُرْبَة قَدْ فَرَّجْتَها وَهُمُوم قَدْ كَشَفْتَها، وَعَثْرَة قَدْ اَقَلْتَها، وَرَحْمَة قَدْ نَشَرْتَها، وَحَلْقَةِ بَلاء قَدْ فَكَكْتَها،\nاَلْحَمْدُ للهِ الَّذي لَمْ يَتَّخِذْ صاحِبَةً وَلا وَلَداً، وَلَمْ يَكُنْ لَهُ شَريكٌ في الْمُلْكِ، وَلَمْ يَكُنْ لَهُ وَلِىٌّ مِنَ الذُّلِّ وَكَبِّرْهُ تَكْبيراً،\nاَلْحَمْدُ للهِ بِجَميعِ مَحامِدِهِ كُلِّهَا، عَلى جَميعِ نِعَمِهِ كُلِّها اَلْحَمْدُ للهِ الَّذي لا مُضادَّ لَهُ في مُلْكِهِ، وَلا مُنازِعَ لَهُ في اَمْرِهِ،\nاَلْحَمْدُ للهِ الَّذي لا شَريكَ لَهُ في خَلْقِهِ، وَلا شَبيهَ لَهُ في عَظَمَتِهِ،\nاَلْحَمْدُ للهِ الْفاشي في الْخَلْقِ اَمْرُهُ وَحَمْدُهُ، الظّاهِرِ بِالْكَرَمِ مَجْدُهُ، الْباسِطِ بِالْجُودِ يَدَهُ، الَّذي لا تَنْقُصُ خَزائِنُهُ، وَلا تَزيدُهُ كَثْرَةُ الْعَطاءِ إلاّ جُوداً وَكَرَماً، اِنَّهُ هُوَ الْعَزيزُ الْوَهّابُ،\nاَللّـهُمَّ اِنّي اَسْاَلُكَ قَليلاً مِنْ كَثير، مَعَ حاجَة بي اِلَيْهِ عَظيمَة وَغِناكَ عَنْهُ قَديمٌ، وَهُوَ عِنْدي كَثيرٌ، وَهُوَ عَلَيْكَ سَهْلٌ يَسيرٌ،\nاَللّـهُمَّ اِنَّ عَفْوَكَ عَنْ ذَنْبي، وَتَجاوُزَكَ عَنْ خَطيـئَتي، وَصَفْحَكَ عَنْ ظُلْمي وَسِتْرَكَ عَنْ قَبيحِ عَمَلي، وَحِلْمَكَ عَنْ كَثيرِ جُرْمي، عِنْدَ ما كانَ مِنْ خَطئي وَعَمْدي، اَطْمَعَني في اَنْ اَسْأَلَكَ ما لا اَسْتَوْجِبُهُ مِنْكَ، الَّذي رَزَقْتَني مِنْ رَحْمَتِكَ، وَاَرَيْتَني مَنْ قُدْرَتِكَ، وَعَرَّفْتَني مِنْ اِجابَتِكَ، فَصِرْتُ اَدْعُوكَ آمِناً، وَاَسْاَلُكَ مُسْتَأنِساً، لا خائِفاً وَلا وَجِلاً، مُدِلاًّ عَلَيْكَ فيـما قَصَدْتُ فيهِ اِلَيْكَ، فَاِنْ اَبْطأَ عَنّي عَتَبْتُ بِجَهْلي عَلَيْكَ، وَلَعَلَّ الَّذي اَبْطأَ عَنّي ه ّذي مِنْ خَشْيَتِهِ تَرْعَدُ السَّماءُ وَسُكّانُها، وَتَرْجُفُ الاَْرْضُ وَعُمّارُها، وَتَمُوجُ الْبِحارُ وَمَنْ يَسْبَحُ في غَمَراتِها،\nاَلْحَمْدُ للهِ الَّذي هَدانا لِهذا وَما كُنّا لِنَهْتَدِيَ لَوْلا اَنْ هَدانَا اللّهُ،\nاَلْحَمْدُ للهِ الَّذي يَخْلُقُ، وَلَمْ يُخْلَقْ وَيَرْزُقُ، وَلا يُرْزَقُ وَيُطْعِمُ، وَلا يُطْعَمُ وَيُميتُ الاَْحياءَ وَيُحْيِي الْمَوْتى وَهُوَ حَيٌّ لا يَمُوتُ، بِيَدِهِ الْخَيْرُ وَهُوَ عَلى كُلِّ شَيْء قَديرٌ،\nاَللّـهُمَّ صَلِّ عَلى مُحَمَّد عَبْدِكَ وَرَسُولِكَ، وَاَمينِكَ، وَصَفِيِّكَ، وَحَبيبِكَ، وَخِيَرَتِكَ مَنْ خَلْقِكَ، وَحافِظِ سِرِّكَ، وَمُبَلِّغِ رِسالاتِكَ، اَفْضَلَ وَاَحْسَنَ، وَاَجْمَلَ وَاَكْمَلَ، وَاَزْكى وَاَنْمى، وَاَطْيَبَ وَاَطْهَرَ، وَاَسْنى وَاَكْثَرَ ما صَلَّيْتَ وَبارَكْتَ وَتَرَحَّمْتَ، وَتَحَنَّنْتَ وَسَلَّمْتَ عَلى اَحَد مِن عِبادِكَ وَاَنْبِيائِكَ وَرُسُلِكَ، وَصِفْوَتِكَ وَاَهْلِ الْكَرامَةِ عَلَيْكَ مِن خَلْقِكَ،\nاَللّـهُمَّ وَصَلِّ عَلى عَليٍّ اَميرِ الْمُؤْمِنينَ، وَوَصِيِّ رَسُولِ رَبِّ الْعالَمينَ، عَبْدِكَ وَوَليِّكَ، وَاَخي رَسُولِكَ، وَحُجَّتِكَ عَلى خَلْقِكَ، وَآيَتِكَ الْكُبْرى، وَالنَّبأِ الْعَظيمِ، وَصَلِّ عَلَى الصِّدّيقَةِ الطّاهِرَةِ فاطِمَةَ سَيِّدَةِ نِساءِ الْعالَمينَ، وَصَلِّ عَلى سِبْطَيِ الرَّحْمَةِ وَاِمامَيِ الْهُدى، الْحَسَنِ وَالْحُسَيْنِ سَيِّدَيْ شَبابِ اَهْلِ الْجَّنَةِ، وَصَلِّ عَلى اَئِمَّةِ الْمُسْلِمينَ، عَلِيِّ بْنِ الْحُسَيْنِ، وَمُحَمَّدِ ابْنِ عَلِيٍّ، وَجَعْفَرِ بْنِ مُحَمَّد، وَمُوسَى بْنِ جَعْفَر، وَعَلِيِّ بْنِ مُوسى، وَمُحَمَّدِ بْنِ عَلِيٍّ، وَعَلِيِّ بْنِ مُحَمَّد، وَالْحَسَنِ بْنِ عَلِىٍّ، وَالْخَلَفِ الْهادي الْمَهْدِيِّ، حُجَجِكَ عَلى عِبادِكَ، وَاُمَنائِكَ في بِلادِكَ صَلَاةً كَثيرَةً دائِمَةً،\nاَللّـهُمَّ وَصَلِّ عَلى وَلِىِّ اَمْرِكَ الْقائِمِ الْمُؤَمَّلِ، وَالْعَدْلِ الْمُنْتَظَرِ، وَحُفَّهُ بِمَلائِكَتِكَ الْمُقَرَّبينَ، وَاَيِّدْهُ بِرُوحِ الْقُدُسِ يا رَبَّ الْعالَمينَ،\nاَللّـهُمَّ اجْعَلْهُ الدّاعِيَ اِلى كِتابِكَ، وَالْقائِمَ بِدينِكَ، اِسْتَخْلِفْهُ في الاَْرْضِ كَما اسْتَخْلَفْتَ الَّذينَ مِنْ قَبْلِهِ، مَكِّنْ لَهُ دينَهُ الَّذي ارْتَضَيْتَهُ لَهُ const back=()=>go(V.from);
const hdr=(t,b)=>`<div class="top">${b?'<button class="ib" onclick="back()" aria-label="رجوع">›</button>':''}<h2>${t}</h2><button class="ib" onclick="go(\'search\',null,V.t)" aria-label="بحث">⌕</button></div>`;
const row=x=>`<button class="row" data-n="${esc(norm(x.title))}" onclick="go('item','${x.id}',V.t)"><span>${esc(x.title)}</span><i class="${x.text?'ok':''}">${x.text?'متوفر':'يُضاف'}</i></button>`;
const flt=`<input placeholder="ابحث في القائمة" oninput="flt(this.value)">`;
function flt_(v){v=norm(v);document.querySelectorAll('.row[data-n]').forEach(r=>r.style.display=r.dataset.n.includes(v)?'':'none')}
window.flt=flt_;
function verses(){const o=[];[112,113,114,108].forEach(k=>QT[k].split('\n').forEach((l,i)=>o.push({l,s:SN[k-1],n:i+1})));return o}
function home(){
 const t=new Date(),h=hj(t),ev=EV.filter(e=>e[0]===h.m&&e[1]===h.d)[0],vs=verses(),dy=Math.floor(t/864e5),a=vs[dy%vs.length],up=upcoming(3),lt=ST.last&&get(ST.last);
 return `<div class="hero"><svg viewBox="0 0 64 64"><g fill="none" stroke="#c9a24b" stroke-width="2"><rect x="12" y="12" width="40" height="40"/><rect x="12" y="12" width="40" height="40" transform="rotate(45 32 32)"/><circle cx="32" cy="32" r="8"/></g></svg><h1>النور</h1><small>AL-NOOR</small></div>
 <button class="date" onclick="go('cal',null,'home')"><b>${hs(h)}</b><span>${gs(t)}</span>${ev?`<span style="color:var(--gd)">اليوم: ${ev[2]}</span>`:''}</button>
 ${lt?`<button class="cont" onclick="go('item','${lt.id}','home')">تابع القراءة: <b>${esc(lt.title)}</b></button>`:''}
 <div class="grid">${[['❖','القرآن','quran'],['✦','الأدعية','dua'],['✧','الزيارات','ziy'],['❂','التاريخ','hist'],['❒','المكتبة','lib'],['◉','الأذكار','tasbih'],['♡','المفضلة','fav'],['⌕','بحث','search']].map(g=>`<button onclick="tab('${g[2]}')"><i>${g[0]}</i>${g[1]}</button>`).join('')}</div>
 <h2>آية اليوم</h2><div class="ayah"><p>${esc(a.l)}</p><small>سورة ${a.s}، الآية ${ar(a.n)}</small></div>
 <h2>المناسبات القادمة</h2>${up.map(u=>`<div class="ev"><span>${u.t}</span><span class="src">${u.i?u.d.toLocaleDateString('ar',{day:'numeric',month:'long',numberingSystem:'arab'}):'اليوم'}</span></div>`).join('')}`}
function tab(k){if(k==='dua'){ST.ds='d';go('dua')}else if(k==='ziy'){ST.ds='z';go('dua')}else go(k,null,'home')}
function listV(c,title){return hdr(title)+flt+all().filter(x=>x.cat===c).map(row).join('')+(c==='q'?'<p class="note">نصوص الفاتحة والكوثر والإخلاص والفلق والناس مضافة. لإضافة بقية السور: افتح السورة والصق نصها من مصحف معتمد.</p>':'')}
function duaV(){return hdr('الأدعية والزيارات')+`<div class="seg"><button class="${ST.ds==='d'?'on':''}" onclick="ST.ds='d';render()">الأدعية</button><button class="${ST.ds==='z'?'on':''}" onclick="ST.ds='z';render()">الزيارات</button></div>`+flt+all().filter(x=>x.cat===ST.ds||(x.cat!=='q'&&x.cat!=='h'&&x.cat!=='b'&&x.cat!=='d'&&x.cat!=='z'&&ST.ds===x.cat)).map(row).join('')}
function itemV(id){const x=get(id);if(!x)return hdr('غير موجود',1);ST.last=id;Wr('last',id);
 let b;
 if(!x.text)b='<p class="empty">لم يُضف نص هذا العنوان بعد. افتح «تعديل النص» والصق النص من مصدر معتمد مع اسم المصدر، ويُحفظ على جهازك.</p>';
 else if(x.cat==='q'){b=(id!=='q1'?'<div class="bsm">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>':'')+'<div class="txt" id="txt">'+x.text.split('\n').map((l,i)=>`<span>${esc(l)} <b class="no">﴿${ar(i+1)}﴾</b></span> `).join('')+'</div>'}
 else b='<div class="txt" id="txt">'+x.text.split('\n').map(l=>`<p>${esc(l)}</p>`).join('')+'</div>';
 const f=ST.fav.includes(id);
 return hdr(esc(x.title),1)+(x.source?`<div class="src">المصدر: ${esc(x.source)}</div>`:'')+`<div class="tools"><button onclick="fz(2)">A+</button><button onclick="fz(-2)">A−</button><button onclick="fav('${id}')">${f?'♥ في المفضلة':'♡ مفضلة'}</button><button onclick="cp('${id}')">نسخ</button><button onclick="sh('${id}')">مشاركة</button></div>`+(x.text?`<input placeholder="بحث داخل النص" oninput="ftx(this.value)">`:'')+b+`<details><summary>تعديل النص والمصدر</summary><textarea id="et">${esc(x.text)}</textarea><input id="es" placeholder="المصدر: الكتاب، الجزء، الصفحة" value="${esc(x.source)}"><button class="btn" onclick="sed('${id}')">حفظ</button></details>`}
function ftx(v){v=norm(v);document.querySelectorAll('#txt>p,#txt>span').forEach(e=>e.style.display=norm(e.textContent).includes(v)?'':'none')}
function fz(d){ST.fs=Math.max(20,Math.min(60,ST.fs+d));Wr('fs',ST.fs);theme()}
function fav(id){const i=ST.fav.indexOf(id);i<0?ST.fav.push(id):ST.fav.splice(i,1);save();render()}
const full=id=>{const x=get(id);return x.title+'\n\n'+x.text+(x.source?'\n\n'+x.source:'')};
async function cp(id){try{await navigator.clipboard.writeText(full(id));toast('تم النسخ')}catch(e){toast('تعذر النسخ')}}
async function sh(id){try{if(navigator.share)await navigator.share({title:get(id).title,text:full(id)});else await cp(id)}catch(e){}}
function sed(id){ST.ov[id]={text:$('#et').value.trim(),source:$('#es').value.trim()};save();toast('تم الحفظ');render()}
function searchV(){return hdr('البحث الشامل',1)+`<input id="sq" placeholder="آية، دعاء، زيارة، حدث، كتاب" oninput="doS(this.value)" autofocus><div id="sr"></div>`}
function doS(v){v=norm(v.trim());if(!v){$('#sr').innerHTML='';return}const r=all().filter(x=>norm(x.title).includes(v)||norm(x.text).includes(v));
 $('#sr').innerHTML=r.length?Object.keys(CAT).map(c=>{const g=r.filter(x=>x.cat===c);return g.length?`<h2>${CAT[c]}</h2>`+g.slice(0,30).map(row).join(''):''}).join(''):'<p class="empty">لا توجد نتائج.</p>'}
function favV(){const f=all().filter(x=>ST.fav.includes(x.id));return hdr('المفضلة')+(f.length?f.map(row).join(''):'<p class="empty">لم تضف شيئاً بعد. اضغط «مفضلة» داخل أي نص.</p>')}
function adjOff(d){ST.off=Math.max(-2,Math.min(2,ST.off+d));Wr('off',ST.off);render()}
function calV(){const h=hj(new Date());return hdr('التقويم والمناسبات',1)+`<div class="date"><b>${hs(h)}</b><span>${gs(new Date())}</span></div><p class="note">التقويم يُحسب بنظام أم القرى ثم يُعدَّل بالفرق أدناه ليوافق رؤية الهلال عندك. اضبطه مع بداية كل شهر.</p><div class="tools"><button onclick="adjOff(-1)">يوم للخلف</button><button onclick="adjOff(1)">يوم للأمام</button><button disabled>الفرق الحالي: ${ar(ST.off)}</button></div>`+upcoming(14).map(u=>`<div class="ev"><span>${u.t}<br><small class="src">${ar(u.h.d)} ${HM[u.h.m-1]}</small></span><span class="src">${u.d.toLocaleDateString('ar',{day:'numeric',month:'long',year:'numeric',numberingSystem:'arab'})}</span></div>`).join('')}
const TP=[{n:'تسبيح الزهراء (ع)',s:[['الله أكبر',34],['الحمد لله',33],['سبحان الله',33]]},{n:'الاستغفار',s:[['أستغفر الله',100]]},{n:'الصلاة على محمد وآل محمد',s:[['اللهم صل على محمد وآل محمد',100]]},{n:'عداد حر',s:[['سبّح',1e9]]}];
function tasV(){const z=ST.tz,p=TP[z.p],s=p.s[z.i];return hdr('الأذكار والتسبيحات',1)+`<div class="seg" style="flex-wrap:wrap">${TP.map((q,i)=>`<button class="${i===z.p?'on':''}" onclick="tp(${i})">${q.n}</button>`).join('')}</div><button class="tas" onclick="tap()" aria-label="سبّح"><small>${s[0]}</small>${ar(z.c)}<small>${s[1]<1e9?'من '+ar(s[1]):''}</small></button><p class="note" style="text-align:center">المجموع المحفوظ: ${ar(z.t)}</p><div style="text-align:center"><button class="btn alt" onclick="tz0()">تصفير العداد</button></div>`}
function tp(i){ST.tz={...ST.tz,p:i,i:0,c:0};Wr('tz',ST.tz);render()}
function tap(){const z=ST.tz,p=TP[z.p];z.c++;z.t++;if(z.c>=p.s[z.i][1]){z.i++;z.c=0;if(z.i>=p.s.length){z.i=0;toast('اكتمل التسبيح')}if(navigator.vibrate)navigator.vibrate(40)}Wr('tz',z);render()}
function tz0(){ST.tz={...ST.tz,i:0,c:0};Wr('tz',ST.tz);render()}
function mineV(){return hdr('مكتبتي')+`<button class="btn alt" onclick="go('fav',null,'mine')">المفضلة (${ar(ST.fav.length)})</button> <button class="btn alt" onclick="go('tasbih',null,'mine')">الأذكار</button> <button class="btn alt" onclick="ST.th=ST.th==='dark'?'light':'dark';Wr('th',ST.th);theme();render()">${ST.th==='dark'?'الوضع النهاري':'الوضع الليلي'}</button>
<h2>إضافة نص جديد</h2><select id="ac">${Object.keys(CAT).map(c=>`<option value="${c}">${CAT[c]}</option>`).join('')}</select><input id="at" placeholder="العنوان"><textarea id="ax" placeholder="النص"></textarea><input id="as" placeholder="المصدر"><button class="btn" onclick="addI()">إضافة</button>
<h2>نسخة احتياطية</h2><textarea id="bk" placeholder="الصق هنا نسخة محفوظة لاستعادتها"></textarea><button class="btn alt" onclick="exp()">تصدير</button> <button class="btn alt" onclick="imp()">استيراد</button><p class="note">بياناتك محفوظة في متصفحك على هذا الجهاز فقط ولا تُرسل إلى أي جهة.</p>`}
function addI(){const t=$('#at').value.trim(),x=$('#ax').value.trim();if(!t||!x){toast('أدخل العنوان والنص');return}const id='x'+Date.now();ST.ex.push({id,cat:$('#ac').value,title:t,text:x,source:$('#as').value.trim()});save();toast('تمت الإضافة');go('item',id,'mine')}
function exp(){$('#bk').value=JSON.stringify({ov:ST.ov,ex:ST.ex,fav:ST.fav})}
function imp(){try{const d=JSON.parse($('#bk').value);if(d.ov&&typeof d.ov==='object')ST.ov={...ST.ov,...d.ov};if(Array.isArray(d.ex))d.ex.forEach(e=>{if(e.id&&!ST.ex.some(y=>y.id===e.id))ST.ex.push(e)});if(Array.isArray(d.fav))ST.fav=[...new Set(ST.fav.concat(d.fav))];save();toast('تم الاستيراد');render()}catch(e){toast('ملف غير صالح')}}
function render(){const v=V.t;
 $('#app').innerHTML=v==='home'?home():v==='quran'?listV('q','القرآن الكريم'):v==='dua'?duaV():v==='ziy'?duaV():v==='hist'?listV('h','التاريخ الإسلامي الشيعي'):v==='lib'?listV('b','مكتبة المصادر'):v==='item'?itemV(V.a):v==='search'?searchV():v==='fav'?favV():v==='cal'?calV():v==='tasbih'?tasV():mineV();
 const m={home:'home',quran:'quran',dua:'dua',ziy:'dua',hist:'hist',lib:'mine',mine:'mine',fav:'mine',tasbih:'mine'}[v==='item'||v==='search'||v==='cal'?V.from:v]||'home';
 $('#nav').innerHTML=[['home','◈','الرئيسية'],['quran','❖','القرآن'],['dua','✦','الأدعية والزيارات'],['hist','❂','التاريخ'],['mine','❒','مكتبتي']].map(t=>`<button class="${t[0]===m?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('')}
theme();render();
</script></body></html>
